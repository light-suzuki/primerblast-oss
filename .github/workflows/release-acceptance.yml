name: Release acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ncbi-blast+ primer3
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,thermo]"
      - name: Run release acceptance
        run: |
          python benchmarks/release_acceptance.py \
            --max-seconds 60 \
            --json-out release-acceptance.json
      - name: Upload acceptance artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-acceptance
          path: release-acceptance.json
