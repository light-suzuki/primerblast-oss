name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,thermo]"
      - name: Run tests
        run: pytest -q
      - name: Browser display regressions
        run: |
          node --check primerblast_oss/webapp/static/studio.js
          node --check primerblast_oss/webapp/static/locus.js
          node --check primerblast_oss/webapp/static/sequence-view.js
          node --check primerblast_oss/webapp/static/flow.js
          node --check primerblast_oss/webapp/static/references.js
          node tests/web_locus.test.js
      - name: Module self-tests
        run: |
          python primerblast_oss/caps.py
          python primerblast_oss/outputs.py
          python primerblast_oss/bed.py
          python primerblast_oss/vcf.py
